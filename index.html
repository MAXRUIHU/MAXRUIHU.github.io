<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>私募量化周刊 · 管理人业绩看板</title>
<meta name="description" content="私募策略业绩周刊数据看板：清洗自 29 期周报，与 A 股大盘指数实时对比。" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230071e3'/%3E%3Cpath d='M7 21l6-8 4 5 8-11' stroke='white' stroke-width='2.6' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
<link rel="stylesheet" href="css/styles.css" />
</head>
<body>

<!-- ============ 密码门禁弹窗 ============ -->
<div class="gate" id="gate" role="dialog" aria-modal="true" aria-labelledby="gate-title">
  <div class="gate-card">
    <div class="gate-icon">
      <svg viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <rect x="4" y="11" width="16" height="10" rx="3"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/>
      </svg>
    </div>
    <h2 id="gate-title">私募量化周刊</h2>
    <p class="gate-sub">请输入访问密码以继续</p>
    <div class="gate-input-row">
      <input type="password" id="gate-pwd" class="gate-input" placeholder="访问密码" autocomplete="off" inputmode="numeric" />
      <button id="gate-btn" class="gate-btn">进入</button>
    </div>
    <p class="gate-error" id="gate-error"></p>
    <div class="gate-qr" id="gate-qr" hidden>
      <img src="img/1132.jpg" alt="微信二维码" />
      <p>密码错误 · 扫码添加微信获取访问密码</p>
    </div>
  </div>
</div>

<div class="app-shell">
  <!-- ============ 导航 ============ -->
  <header class="nav" id="nav">
    <div class="nav-inner">
      <a class="brand" href="#/" data-nav="overview">
        <span class="brand-mark">
          <svg viewBox="0 0 32 32" width="26" height="26" aria-hidden="true">
            <rect width="32" height="32" rx="8" fill="var(--accent)"/>
            <path d="M7 21l6-8 4 5 8-11" stroke="#fff" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </span>
        <span class="brand-text">私募量化周刊<em>Quant Weekly</em></span>
      </a>
      <nav class="nav-links" id="nav-links">
        <a href="#/" data-nav="overview" class="nav-link">总览</a>
        <a href="#/market" data-nav="market" class="nav-link">A股市场</a>
        <a href="#/qa" data-nav="qa" class="nav-link">数据质量</a>
      </nav>
      <div class="nav-tools">
        <span class="update-chip" id="update-chip" title="数据生成时间">
          <span class="dot"></span><span id="update-text">加载中…</span>
        </span>
        <button class="icon-btn" id="refresh-btn" title="刷新数据" aria-label="刷新数据">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36M21 3v6h-6"/></svg>
        </button>
        <button class="icon-btn" id="theme-btn" title="切换深色模式" aria-label="切换深色模式">
          <svg class="icon-moon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
          <svg class="icon-sun" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.93 4.93l1.41 1.41m11.32 11.32 1.41 1.41M2 12h2m16 0h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
        </button>
      </div>
    </div>
  </header>

  <!-- ============ 主内容 ============ -->
  <main id="app" class="main"></main>

  <!-- ============ 页脚 ============ -->
  <footer class="footer">
    <div class="footer-inner">
      <p>数据来源：私募策略业绩周刊（每周更新）· 指数数据：腾讯财经 / 中证指数官网</p>
      <p class="muted" id="footer-meta">—</p>
    </div>
  </footer>
</div>

<div class="toast" id="toast" role="status"></div>

<script src="js/charts.js"></script>
<script src="js/app.js"></script>
</body>
</html>
