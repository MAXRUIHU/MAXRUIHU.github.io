services:
  app:
    build: .
    image: pe-dashboard:latest
    container_name: pe-dashboard
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      PE_FORCE_SECURE: "1"
    # 数据热更新：git pull 后无需重新构建镜像，restart 即可生效
    volumes:
      - ./public/data:/app/public/data
      - ./data:/app/data
